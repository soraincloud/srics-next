name: Verify library and recovery
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: brew install webp
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
      - run: ./scripts/check.sh
      - run: bash scripts/check-security.sh
      - run: ./scripts/package-macos.sh --skip-build
      - name: Verify bundled runtime without Homebrew
        run: env PATH=/usr/bin:/bin:/usr/sbin:/sbin './dist/SRICS Next.app/Contents/Resources/bin/srics' verify --report reports/bundled-runtime.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m0-verification-report
          path: |
            reports/*.json
            reports/security-*.txt
          if-no-files-found: ignore
