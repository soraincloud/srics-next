name: Verify library and recovery
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: brew install webp
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
      - run: ./scripts/check.sh
      - run: bash scripts/check-security.sh
      # App packaging needs Xcode / Icon Composer 27 and is performed locally.
      - name: Verify embedded source and license
        run: python3 scripts/prepare-open-source.py --verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            reports/*.json
            reports/security-*.txt
          if-no-files-found: ignore
